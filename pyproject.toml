[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mdjudge"
version = "0.0.3"
description = "Judgement requests over the mddb card substrate"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mddb>=0.0.27"]

[tool.setuptools.packages.find]
where = ["src"]
