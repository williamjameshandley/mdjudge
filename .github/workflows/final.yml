name: Final validation
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact candidate commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest 'mddb @ git+https://github.com/handley-lab/mddb.git@39d28ca91372bcdc2c6ac1b76a23276ee6c49fe4'
      - run: scripts/check
        env:
          GIT_AUTHOR_NAME: GitHub Actions
          GIT_AUTHOR_EMAIL: actions@github.com
          GIT_COMMITTER_NAME: GitHub Actions
          GIT_COMMITTER_EMAIL: actions@github.com
