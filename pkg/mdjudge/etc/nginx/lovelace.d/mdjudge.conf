# Judgement queue on the front door: /judge -> the mdjudge unix socket.
location = /judge {
    return 301 /judge/;
}
location /judge/ {
    proxy_pass http://unix:/run/mdjudge/http.sock:;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
}
